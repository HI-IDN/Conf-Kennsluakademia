name: Publish Quarto article

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto with TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render PDF and HTML
        run: quarto render *.qmd

      - name: Collect site
        run: |
          mkdir -p _site/template/quarto _site/template/logos
          cp -r *.html *_files *.pdf _site/
          cp template/quarto/kennsluakademia.css _site/template/quarto/
          cp template/logos/short.svg template/logos/favicon.svg _site/template/logos/
          cp "$(ls *.html | head -n 1)" _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
