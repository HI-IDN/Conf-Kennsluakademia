name: Publish Quarto article

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Inkscape for SVG-to-PDF conversion
        run: |
          sudo apt-get update
          sudo apt-get install --yes inkscape fonts-liberation

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto with TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render PDF and HTML
        run: quarto render article.qmd

      - name: Collect site
        run: |
          mkdir -p _site/quarto
          cp -r article.html article_files article.pdf _site/
          cp quarto/kennsluakademia.css quarto/favicon.svg quarto/logo-short.svg quarto/logo-long.svg _site/quarto/
          cp article.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
