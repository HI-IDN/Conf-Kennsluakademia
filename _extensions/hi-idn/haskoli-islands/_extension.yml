title: Háskóli Íslands Theme (HTML)
author: HI-IDN
version: 0.2.0
quarto-required: ">=1.5.0"
# HTML-only subset of the HÍ Quarto theme (tungufoss/quarto-haskoli-islands-theme v0.2.0).
# Registered as the `haskoli-islands-html` format.
contributes:
  formats:
    html:
      lang: en
      date-format: long
      citations-hover: true
      footnotes-hover: true
      include-in-header:
        - text: |
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800;900&display=swap">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
      theme:
        - cosmo
        - html.scss
      toc: true
      toc-location: right
      code-overflow: wrap
      link-external-icon: true
      smooth-scroll: true
      anchor-sections: true
